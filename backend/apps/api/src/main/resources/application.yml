spring:
  application:
    name: stratuscloud-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stratuscloud}
    username: ${DB_USERNAME:stratus}
    password: ${DB_PASSWORD:stratus}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

security:
  oidc:
    issuer-uri: ${SECURITY_OIDC_ISSUER_URI:http://localhost:8081/realms/stratuscloud}
    jwk-set-uri: ${SECURITY_OIDC_JWK_SET_URI:http://localhost:8081/realms/stratuscloud/protocol/openid-connect/certs}
  api-key:
    header-name: ${SECURITY_API_KEY_HEADER_NAME:X-API-Key}
  legacy-rbac-header-enabled: ${SECURITY_LEGACY_RBAC_HEADER_ENABLED:false}

storage:
  root-path: ${STORAGE_ROOT_PATH:build/storage-data}
