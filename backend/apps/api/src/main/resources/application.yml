spring:
  application:
    name: stratuscloud-api
  datasource:
    # 한국어 설명: 운영 환경에서 PostgreSQL 연결 정보를 환경변수로 주입받는다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stratuscloud}
    username: ${DB_USERNAME:stratus}
    password: ${DB_PASSWORD:stratus}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
