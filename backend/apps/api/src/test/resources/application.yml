spring:
  datasource:
    url: jdbc:h2:mem:stratuscloud;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: debug

security:
  oidc:
    issuer-uri:
    jwk-set-uri:
  api-key:
    header-name: X-API-Key
  legacy-rbac-header-enabled: true
