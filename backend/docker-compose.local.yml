name: StratusCloud

services:
  postgres:
    image: postgres:16-alpine
    container_name: stratuscloud-postgres
    environment:
      POSTGRES_DB: stratuscloud
      POSTGRES_USER: stratus
      POSTGRES_PASSWORD: stratus
    ports:
      - "5432:5432"
    volumes:
      - stratuscloud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratus -d stratuscloud"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    build:
      context: ./docker/keycloak
    container_name: stratuscloud-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  stratuscloud-postgres-data:
