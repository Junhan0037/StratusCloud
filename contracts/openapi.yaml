openapi: 3.1.0
info:
  title: StratusCloud Public API
  version: 0.2.0
  description: |
    StratusCloud 1차 MVP 공개 REST API 계약서.
    Week 2에서는 IAM-1 범위(프로젝트/사용자/멤버십)를 포함한다.
servers:
  - url: https://api.stratuscloud.local
    description: local development gateway

tags:
  - name: system
    description: 운영 상태 조회 API
  - name: iam
    description: IAM 및 프로젝트 관리 API

paths:
  /v1/system/ping:
    get:
      tags: [system]
      summary: API 동작 상태를 확인한다.
      operationId: getSystemPing
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  /v1/projects:
    post:
      tags: [iam]
      summary: 프로젝트를 생성한다.
      operationId: createProject
      parameters:
        - $ref: '#/components/parameters/XProjectRole'
        - $ref: '#/components/parameters/XActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 테넌트 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/projects/{projectId}:
    get:
      tags: [iam]
      summary: 프로젝트 단건 정보를 조회한다.
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/XProjectRole'
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: 프로젝트 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/iam/users:
    post:
      tags: [iam]
      summary: 사용자를 생성한다.
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/XProjectRole'
        - $ref: '#/components/parameters/XActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/projects/{projectId}/members:
    post:
      tags: [iam]
      summary: 프로젝트 멤버를 추가한다.
      operationId: addProjectMember
      parameters:
        - $ref: '#/components/parameters/XProjectRole'
        - $ref: '#/components/parameters/XActorId'
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembershipRequest'
      responses:
        '201':
          description: 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '404':
          description: 프로젝트 또는 사용자 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 존재하는 멤버십
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/projects/{projectId}/members/{userId}/role:
    patch:
      tags: [iam]
      summary: 프로젝트 멤버 역할을 변경한다.
      operationId: updateProjectMemberRole
      parameters:
        - $ref: '#/components/parameters/XProjectRole'
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRoleRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '404':
          description: 멤버십 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    XProjectRole:
      name: X-Project-Role
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/RoleType'
      description: Week 2 임시 RBAC 헤더
    XActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 요청 수행 주체 식별자

  schemas:
    PingResponse:
      type: object
      required: [message, traceId]
      properties:
        message:
          type: string
          example: pong
        traceId:
          type: string
          pattern: '^[a-f0-9]{32}$'

    RoleType:
      type: string
      enum: [OWNER, ADMIN, DEVELOPER, VIEWER]

    CreateProjectRequest:
      type: object
      required: [tenantId, name]
      properties:
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 100

    Project:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 2
          maxLength: 100

    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time

    AddMembershipRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'

    UpdateMembershipRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleType'

    Membership:
      type: object
      required: [id, tenantId, projectId, userId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
