openapi: 3.1.0
info:
  title: StratusCloud Public API
  version: 0.3.0
  description: |
    StratusCloud 1차 MVP 공개 REST API 계약서.
    Week 3에서는 IAM-2 범위(OIDC JWT/API Key/Policy)를 포함한다.
servers:
  - url: https://api.stratuscloud.local
    description: local development gateway

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: system
    description: 운영 상태 조회 API
  - name: iam
    description: IAM 및 프로젝트 관리 API
  - name: audit
    description: 감사로그 조회 API

paths:
  /v1/system/ping:
    get:
      tags: [system]
      summary: API 동작 상태를 확인한다.
      operationId: getSystemPing
      security: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  /v1/projects:
    post:
      tags: [iam]
      summary: 프로젝트를 생성한다.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/projects/{projectId}:
    get:
      tags: [iam]
      summary: 프로젝트 단건 정보를 조회한다.
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /v1/iam/users:
    post:
      tags: [iam]
      summary: 사용자를 생성한다.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /v1/projects/{projectId}/members:
    post:
      tags: [iam]
      summary: 프로젝트 멤버를 추가한다.
      operationId: addProjectMember
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembershipRequest'
      responses:
        '201':
          description: 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'

  /v1/projects/{projectId}/members/{userId}/role:
    patch:
      tags: [iam]
      summary: 프로젝트 멤버 역할을 변경한다.
      operationId: updateProjectMemberRole
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRoleRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'

  /v1/iam/policies:
    post:
      tags: [iam]
      summary: 정책 문서를 생성한다.
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    get:
      tags: [iam]
      summary: 테넌트의 정책 목록을 조회한다.
      operationId: listPolicies
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'

  /v1/iam/roles:
    post:
      tags: [iam]
      summary: 역할에 정책 목록을 바인딩한다.
      operationId: bindRolePolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindRolePoliciesRequest'
      responses:
        '200':
          description: 바인딩 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolePolicy'

  /v1/iam/api-keys:
    post:
      tags: [iam]
      summary: API Key를 발급한다.
      operationId: issueApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    get:
      tags: [iam]
      summary: 테넌트의 API Key 목록을 조회한다.
      operationId: listApiKeys
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'

  /v1/iam/api-keys/{keyId}:
    delete:
      tags: [iam]
      summary: API Key를 회수한다.
      operationId: revokeApiKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 회수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'

  /v1/iam/secrets:
    post:
      tags: [iam]
      summary: Secret을 생성한다.
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
    get:
      tags: [iam]
      summary: Secret 목록을 조회한다.
      operationId: listSecrets
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'

  /v1/iam/secrets/{secretId}:
    get:
      tags: [iam]
      summary: Secret 메타데이터를 조회한다.
      operationId: getSecret
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'

  /v1/iam/secrets/{secretId}/versions:
    get:
      tags: [iam]
      summary: Secret 버전 메타데이터를 조회한다.
      operationId: listSecretVersions
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretVersion'

  /v1/iam/secrets/{secretId}:rotate:
    post:
      tags: [iam]
      summary: Secret을 회전해 새 버전을 생성한다.
      operationId: rotateSecret
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSecretRequest'
      responses:
        '200':
          description: 회전 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'

  /v1/iam/secrets/{secretId}/versions/{versionId}:
    delete:
      tags: [iam]
      summary: Secret 버전을 회수한다.
      operationId: revokeSecretVersion
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 회수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'

  /v1/audit/logs:
    get:
      tags: [audit]
      summary: 감사로그를 필터 조건으로 조회한다.
      operationId: listAuditLogs
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
        - name: actorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditResult'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC issuer/JWKS 검증을 통과한 JWT 토큰
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 머신 간 호출용 API Key

  schemas:
    PingResponse:
      type: object
      required: [message, traceId]
      properties:
        message:
          type: string
          example: pong
        traceId:
          type: string
          pattern: '^[a-f0-9]{32}$'

    RoleType:
      type: string
      enum: [OWNER, ADMIN, DEVELOPER, VIEWER]

    ApiKeyStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    SecretVersionStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    AuditResult:
      type: string
      enum: [SUCCESS, DENIED]

    CreateProjectRequest:
      type: object
      required: [tenantId, name]
      properties:
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 100

    Project:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 2
          maxLength: 100

    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time

    AddMembershipRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'

    UpdateMembershipRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/RoleType'

    Membership:
      type: object
      required: [id, tenantId, projectId, userId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'
        createdAt:
          type: string
          format: date-time

    PolicyDocument:
      type: object
      required: [version, statements]
      properties:
        version:
          type: string
        statements:
          type: array
          items:
            type: object
            required: [effect, actions, resources]
            properties:
              effect:
                type: string
                enum: [ALLOW, DENY]
              actions:
                type: array
                items:
                  type: string
              resources:
                type: array
                items:
                  type: string

    CreatePolicyRequest:
      type: object
      required: [tenantId, name, document]
      properties:
        tenantId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 300
        document:
          $ref: '#/components/schemas/PolicyDocument'

    Policy:
      type: object
      required: [id, tenantId, name, document, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        document:
          $ref: '#/components/schemas/PolicyDocument'
        createdAt:
          type: string
          format: date-time

    BindRolePoliciesRequest:
      type: object
      required: [tenantId, role, policyIds]
      properties:
        tenantId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'
        policyIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    RolePolicy:
      type: object
      required: [id, tenantId, role, policyId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'
        policyId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateApiKeyRequest:
      type: object
      required: [tenantId, name, role]
      properties:
        tenantId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 2
          maxLength: 100
        role:
          $ref: '#/components/schemas/RoleType'
        expiresAt:
          type: string
          format: date-time
          nullable: true

    ApiKey:
      type: object
      required: [id, tenantId, name, role, keyPrefix, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        role:
          $ref: '#/components/schemas/RoleType'
        keyPrefix:
          type: string
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        rawKey:
          type: string
          nullable: true
          description: 발급 시 1회만 반환되는 원문 키

    CreateSecretRequest:
      type: object
      required: [tenantId, name, value]
      properties:
        tenantId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 2
          maxLength: 100
        value:
          type: string
          minLength: 1
          maxLength: 4096

    RotateSecretRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4096

    SecretVersion:
      type: object
      required: [id, version, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        status:
          $ref: '#/components/schemas/SecretVersionStatus'
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        value:
          type: string
          nullable: true
          description: 생성/회전 응답에서만 1회 노출되는 값

    Secret:
      type: object
      required: [id, tenantId, name, latestVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        latestVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        currentVersion:
          allOf:
            - $ref: '#/components/schemas/SecretVersion'
          nullable: true

    AuditLog:
      type: object
      required: [id, traceId, actorId, tenantId, action, resourceType, result, metadata, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        traceId:
          type: string
        actorId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        result:
          $ref: '#/components/schemas/AuditResult'
        metadata:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
