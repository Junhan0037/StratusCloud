openapi: 3.1.0
info:
  title: StratusCloud Public API
  version: 0.5.0
  description: |
    StratusCloud 1차 MVP 공개 REST API 계약서.
    Week 7에서는 Network-1 범위(VPC/Subnet/SG/Route)를 포함한다.
servers:
  - url: https://api.stratuscloud.local
    description: local development gateway

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: system
    description: 운영 상태 조회 API
  - name: iam
    description: IAM 및 프로젝트 관리 API
  - name: compute
    description: Compute Image 및 Instance API
  - name: network
    description: VPC/Subnet/Route Table/Security Group API
  - name: audit
    description: 감사로그 조회 API

paths:
  /v1/system/ping:
    get:
      tags: [system]
      summary: API 동작 상태를 확인한다.
      operationId: getSystemPing
      security: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  /v1/projects:
    post:
      tags: [iam]
      summary: 프로젝트를 생성한다.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/projects/{projectId}:
    get:
      tags: [iam]
      summary: 프로젝트 단건 정보를 조회한다.
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /v1/iam/users:
    post:
      tags: [iam]
      summary: 사용자를 생성한다.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /v1/projects/{projectId}/members:
    post:
      tags: [iam]
      summary: 프로젝트 멤버를 추가한다.
      operationId: addProjectMember
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMembershipRequest'
      responses:
        '201':
          description: 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'

  /v1/projects/{projectId}/members/{userId}/role:
    patch:
      tags: [iam]
      summary: 프로젝트 멤버 역할을 변경한다.
      operationId: updateProjectMemberRole
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRoleRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'

  /v1/iam/policies:
    post:
      tags: [iam]
      summary: 정책 문서를 생성한다.
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    get:
      tags: [iam]
      summary: 테넌트의 정책 목록을 조회한다.
      operationId: listPolicies
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'

  /v1/iam/roles:
    post:
      tags: [iam]
      summary: 역할에 정책 목록을 바인딩한다.
      operationId: bindRolePolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindRolePoliciesRequest'
      responses:
        '200':
          description: 바인딩 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolePolicy'

  /v1/iam/api-keys:
    post:
      tags: [iam]
      summary: API Key를 발급한다.
      operationId: issueApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
    get:
      tags: [iam]
      summary: 테넌트의 API Key 목록을 조회한다.
      operationId: listApiKeys
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'

  /v1/iam/api-keys/{keyId}:
    delete:
      tags: [iam]
      summary: API Key를 회수한다.
      operationId: revokeApiKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 회수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'

  /v1/iam/secrets:
    post:
      tags: [iam]
      summary: Secret을 생성한다.
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
    get:
      tags: [iam]
      summary: Secret 목록을 조회한다.
      operationId: listSecrets
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            nullable: true
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'

  /v1/iam/secrets/{secretId}:
    get:
      tags: [iam]
      summary: Secret 메타데이터를 조회한다.
      operationId: getSecret
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'

  /v1/iam/secrets/{secretId}/versions:
    get:
      tags: [iam]
      summary: Secret 버전 메타데이터를 조회한다.
      operationId: listSecretVersions
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretVersion'

  /v1/iam/secrets/{secretId}:rotate:
    post:
      tags: [iam]
      summary: Secret을 회전해 새 버전을 생성한다.
      operationId: rotateSecret
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSecretRequest'
      responses:
        '200':
          description: 회전 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'

  /v1/iam/secrets/{secretId}/versions/{versionId}:
    delete:
      tags: [iam]
      summary: Secret 버전을 회수한다.
      operationId: revokeSecretVersion
      parameters:
        - name: secretId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 회수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'

  /v1/compute/images:
    post:
      tags: [compute]
      summary: 베이스 이미지를 등록한다.
      operationId: createComputeImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComputeImageRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeImage'
    get:
      tags: [compute]
      summary: 이미지 카탈로그를 조회한다.
      operationId: listComputeImages
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ComputeImageStatus'
        - name: osType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ComputeOsType'
        - name: tag
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputeImage'

  /v1/compute/images/{imageId}:
    get:
      tags: [compute]
      summary: 이미지 단건을 조회한다.
      operationId: getComputeImage
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeImage'

  /v1/compute/instances:
    post:
      tags: [compute]
      summary: 인스턴스를 생성한다.
      operationId: createComputeInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComputeInstanceRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstance'
    get:
      tags: [compute]
      summary: 프로젝트의 인스턴스 목록을 조회한다.
      operationId: listComputeInstances
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputeInstance'

  /v1/compute/instances/{instanceId}:
    get:
      tags: [compute]
      summary: 인스턴스 단건을 조회한다.
      operationId: getComputeInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstance'
    delete:
      tags: [compute]
      summary: 인스턴스를 종료한다.
      operationId: terminateComputeInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 종료 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstance'

  /v1/compute/instances/{instanceId}:start:
    post:
      tags: [compute]
      summary: 정지된 인스턴스를 시작한다.
      operationId: startComputeInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 시작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstance'

  /v1/compute/instances/{instanceId}:stop:
    post:
      tags: [compute]
      summary: 실행 중인 인스턴스를 정지한다.
      operationId: stopComputeInstance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 정지 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstance'

  /v1/compute/instances/{instanceId}/metrics:
    post:
      tags: [compute]
      summary: 인스턴스의 최신 CPU/메모리 메트릭을 기록한다.
      operationId: writeComputeInstanceMetric
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteComputeInstanceMetricRequest'
      responses:
        '200':
          description: 기록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstanceMetric'

  /v1/compute/instances/{instanceId}/health:
    post:
      tags: [compute]
      summary: 인스턴스의 최신 헬스 상태를 기록한다.
      operationId: writeComputeInstanceHealth
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteComputeInstanceHealthRequest'
      responses:
        '200':
          description: 기록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeInstanceHealth'

  /v1/compute/autoscaling-groups:
    post:
      tags: [compute]
      summary: 오토스케일 그룹을 생성한다.
      operationId: createComputeAutoscalingGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComputeAutoscalingGroupRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeAutoscalingGroup'
    get:
      tags: [compute]
      summary: 프로젝트의 오토스케일 그룹 목록을 조회한다.
      operationId: listComputeAutoscalingGroups
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputeAutoscalingGroup'

  /v1/compute/autoscaling-groups/{groupId}:
    get:
      tags: [compute]
      summary: 오토스케일 그룹 단건을 조회한다.
      operationId: getComputeAutoscalingGroup
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeAutoscalingGroup'

  /v1/compute/autoscaling-groups/{groupId}:evaluate:
    post:
      tags: [compute]
      summary: 그룹의 최신 메트릭 기준으로 desired 인스턴스 수를 재계산한다.
      operationId: evaluateComputeAutoscalingGroup
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 평가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeAutoscalingGroup'

  /v1/compute/autoscaling-groups/{groupId}:reconcile-health:
    post:
      tags: [compute]
      summary: 그룹 내 누적 실패 인스턴스를 재시작 우선 정책으로 복구한다.
      operationId: reconcileComputeAutoscalingGroupHealth
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 복구 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeHealthReconcileResult'

  /v1/network/vpcs:
    post:
      tags: [network]
      summary: 프로젝트에 VPC를 생성한다.
      operationId: createVpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVpcRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vpc'
    get:
      tags: [network]
      summary: 프로젝트의 VPC 목록을 조회한다.
      operationId: listVpcs
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vpc'

  /v1/network/vpcs/{vpcId}:
    get:
      tags: [network]
      summary: VPC 단건 정보를 조회한다.
      operationId: getVpc
      parameters:
        - name: vpcId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vpc'
    delete:
      tags: [network]
      summary: 하위 리소스가 없는 VPC를 삭제한다.
      operationId: deleteVpc
      parameters:
        - name: vpcId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 삭제 성공

  /v1/network/subnets:
    post:
      tags: [network]
      summary: VPC 내부에 Subnet을 생성한다.
      operationId: createSubnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubnetRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
    get:
      tags: [network]
      summary: 프로젝트 또는 VPC 범위의 Subnet 목록을 조회한다.
      operationId: listSubnets
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: vpcId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subnet'

  /v1/network/subnets/{subnetId}:
    get:
      tags: [network]
      summary: Subnet 단건 정보를 조회한다.
      operationId: getSubnet
      parameters:
        - name: subnetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
    delete:
      tags: [network]
      summary: Subnet을 삭제한다.
      operationId: deleteSubnet
      parameters:
        - name: subnetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 삭제 성공

  /v1/network/route-tables:
    post:
      tags: [network]
      summary: VPC에 Route Table을 생성한다.
      operationId: createRouteTable
