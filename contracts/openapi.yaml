components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC issuer/JWKS 검증을 통과한 JWT 토큰
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 머신 간 호출용 API Key

  schemas:
    PingResponse:
      type: object
      required: [message, traceId]
      properties:
        message:
          type: string
          example: pong
        traceId:
          type: string
          pattern: '^[a-f0-9]{32}$'

    RoleType:
      type: string
      enum: [OWNER, ADMIN, DEVELOPER, VIEWER]

    ApiKeyStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    SecretVersionStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    AuditResult:
      type: string
      enum: [SUCCESS, DENIED]

    ComputeImageStatus:
      type: string
      enum: [ACTIVE, DEPRECATED]

    ComputeInstanceStatus:
      type: string
      enum: [PENDING, RUNNING, STOPPED, TERMINATED]

    ComputeHealthStatus:
      type: string
      enum: [UNKNOWN, HEALTHY, UNHEALTHY]

    ComputeHealthPolicy:
      type: string
      enum: [RESTART]

    ComputeAutoscalingGroupStatus:
      type: string
      enum: [ACTIVE]

    ComputeOsType:
      type: string
      enum: [LINUX, WINDOWS]

    NetworkRouteTargetType:
      type: string
